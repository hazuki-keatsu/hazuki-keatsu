# 创建 Snake, see: https://github.com/Platane/snk

# 工作流名称
name: Generate Snake

# 工作流触发时机, see: https://docs.github.com/zh/actions/using-workflows/triggering-a-workflow
# 每天更新一次；生成物发布到 output 分支，不污染 main 的历史。
on:
  schedule:
    - cron:  "0 0 * * *" 
  workflow_dispatch:

# 作业, see: https://docs.github.com/zh/actions/using-jobs/using-jobs-in-a-workflow
permissions: 
    contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      # 使用 actions/checkout, see: https://github.com/actions/checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 使用 Platane/snk 生成图片, see: https://github.com/Platane/snk
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: hazuki-keatsu
          outputs: |
            assets/dist/github-snake.svg?color_snake=#9c404c
            assets/dist/github-snake-dark.svg?palette=github-dark&color_snake=#f4c5d2

      # 发布到独立的孤儿分支。每次发布都会替换该分支的唯一提交，
      # 从而不累积生成文件的 Git 历史。
      - name: Publish Snake
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./assets/dist
          force_orphan: true
